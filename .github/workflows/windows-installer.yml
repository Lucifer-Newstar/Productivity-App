name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (must match frontend/package.json)
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Kaizen CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  delivery-gate:
    name: Validate delivery gate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require successful upstream CI
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]] || { echo "Upstream Kaizen CI did not pass"; exit 1; }
          [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]] || { echo "Delivery only accepts main"; exit 1; }
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version=$(node -p "require('./frontend/package.json').version")
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must use x.y.z"; exit 1; }
          app_version=$(node -p "require('./frontend/package.json').version")
          [[ "$version" == "$app_version" ]] || { echo "Version $version does not match frontend package $app_version"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Privacy and release-source gate
        run: python3 ai/wave0/scripts/privacy_scan.py --mode tracked
      - name: Require tag provenance and green main CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Release tag must point to main history"; exit 1; }
          [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]] || { echo "Release tag must be annotated"; exit 1; }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "Missing reviewed release notes: docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }
          successful=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 20 --json status,conclusion,databaseId --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          [[ "$successful" -gt 0 ]] || { echo "No successful main Kaizen CI run exists for release commit $GITHUB_SHA"; exit 1; }

  build-and-verify:
    name: Build and verify Windows setup
    needs: delivery-gate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ai/package-lock.json
            packaging/desktop/package-lock.json
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Install application and desktop dependencies
        shell: pwsh
        run: |
          npm ci --prefix frontend
          npm ci --prefix ai
          npm ci --prefix packaging/desktop
      - name: Build frontend and Intelligence workspaces
        shell: pwsh
        env:
          KAIZEN_LOCAL_PACKAGE: "1"
          KAIZEN_UPDATE_CHANNEL: github
          KAIZEN_DESKTOP: "1"
        run: |
          npm run build --prefix frontend
          npm run build --prefix ai
          $required = @(
            "frontend/.next/standalone/server.js",
            "ai/dist/src/server.js",
            "packaging/desktop/node_modules/electron/dist/electron.exe"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing package build output: $path" } }
      - name: Build single-file setup
        shell: pwsh
        env:
          KAIZEN_RELEASE_VERSION: ${{ needs.delivery-gate.outputs.version }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1 -Version $env:KAIZEN_RELEASE_VERSION -SkipInstall -SkipBuild
      - name: Install silently
        shell: pwsh
        env:
          KAIZEN_RELEASE_VERSION: ${{ needs.delivery-gate.outputs.version }}
        run: |
          $setup = "release-artifacts/Kaizen-$env:KAIZEN_RELEASE_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not produced" }
          $process = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)" }
      - name: Exercise in-place update
        shell: pwsh
        env:
          KAIZEN_RELEASE_VERSION: ${{ needs.delivery-gate.outputs.version }}
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs/Kaizen"
          $stateFile = Join-Path $env:LOCALAPPDATA "Kaizen/runtime.json"
          Remove-Item $stateFile -Force -ErrorAction SilentlyContinue
          Start-Process "$install/desktop/electron.exe" -ArgumentList "`"$install/desktop/main.cjs`"" -WindowStyle Hidden
          $state = $null
          for ($attempt = 0; $attempt -lt 80; $attempt++) {
            if (Test-Path $stateFile) { try { $state = Get-Content $stateFile -Raw | ConvertFrom-Json } catch {} }
            if ($state.desktopReady -and (Test-NetConnection 127.0.0.1 -Port $state.frontendPort -InformationLevel Quiet -WarningAction SilentlyContinue)) { break }
            Start-Sleep -Milliseconds 250
          }
          if (-not $state) { throw "Desktop application did not publish runtime state before update test" }
          $setup = "release-artifacts/Kaizen-$env:KAIZEN_RELEASE_VERSION-win-x64-setup.exe"
          $process = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "In-place setup update failed with exit code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-NetConnection 127.0.0.1 -Port $state.frontendPort -InformationLevel Quiet -WarningAction SilentlyContinue) { throw "Update did not stop the previous frontend process" }
          if (Test-NetConnection 127.0.0.1 -Port $state.enginePort -InformationLevel Quiet -WarningAction SilentlyContinue) { throw "Update did not stop the previous engine process" }
      - name: Verify installed runtime
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs/Kaizen"
          & "$install/runtime/node/node.exe" "$install/scripts/verify-package.mjs" --report "$env:RUNNER_TEMP/package-verification.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed package verification failed" }
          $report = Get-Content "$env:RUNNER_TEMP/package-verification.json" -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.classification -ne "PUBLIC-SANITIZED-AGGREGATE") { throw "Verification report did not pass its public-safe contract" }
          Copy-Item "$env:RUNNER_TEMP/package-verification.json" "release-artifacts/package-verification.json"
      - name: Uninstall silently
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs/Kaizen"
          $uninstaller = Get-ChildItem $install -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Registered uninstaller was not found" }
          $process = Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed with exit code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$install/frontend/server.js") { throw "Installed runtime remained after uninstall" }
      - name: Create sanitized delivery manifest
        shell: pwsh
        env:
          KAIZEN_RELEASE_VERSION: ${{ needs.delivery-gate.outputs.version }}
        run: |
          $setup = "release-artifacts/Kaizen-$env:KAIZEN_RELEASE_VERSION-win-x64-setup.exe"
          $signature = (Get-AuthenticodeSignature $setup).Status.ToString()
          [ordered]@{
            classification = "PUBLIC-SANITIZED-AGGREGATE"
            contract = "kaizen.windows-delivery-manifest"
            version = "1.0"
            releaseVersion = $env:KAIZEN_RELEASE_VERSION
            commit = "${{ github.event.workflow_run.head_sha || github.sha }}"
            buildNode = "22.22.0"
            bundledNodeRuntime = "20.19.0"
            electron = "43.4.1"
            innoSetup = "6.7.1"
            authenticode = $signature
            installUpdateVerifyUninstall = "PASS"
          } | ConvertTo-Json | Set-Content "release-artifacts/release-manifest.json"
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-${{ needs.delivery-gate.outputs.version }}-win-x64
          path: |
            release-artifacts/Kaizen-${{ needs.delivery-gate.outputs.version }}-win-x64-setup.exe
            release-artifacts/Kaizen-${{ needs.delivery-gate.outputs.version }}-win-x64-setup.exe.sha256
            release-artifacts/package-verification.json
            release-artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  continuous-release:
    name: Update public continuous prerelease
    if: github.event_name == 'workflow_run'
    needs: [delivery-gate, build-and-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: Kaizen-${{ needs.delivery-gate.outputs.version }}-win-x64
          path: release-artifacts
      - name: Move continuous tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f continuous "$DELIVERY_SHA"
          git push origin refs/tags/continuous --force
          if gh release view continuous --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit continuous --repo "${{ github.repository }}" --prerelease --title "Kaizen Continuous Build" --notes "Automated verified build from main at $DELIVERY_SHA. This rolling prerelease is for testing; stable installations ignore it."
          else
            gh release create continuous --repo "${{ github.repository }}" --prerelease --target "$DELIVERY_SHA" --title "Kaizen Continuous Build" --notes "Automated verified build from main at $DELIVERY_SHA. This rolling prerelease is for testing; stable installations ignore it."
          fi
          gh release upload continuous release-artifacts/* --repo "${{ github.repository }}" --clobber

  github-release:
    name: Publish open-source release
    if: github.ref_type == 'tag'
    needs: [delivery-gate, build-and-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Kaizen-${{ needs.delivery-gate.outputs.version }}-win-x64
          path: release-artifacts
      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* \
            --repo "${{ github.repository }}" \
            --title "Kaizen ${{ github.ref_name }}" \
            --notes-file "docs/releases/${{ github.ref_name }}.md" \
            --verify-tag
