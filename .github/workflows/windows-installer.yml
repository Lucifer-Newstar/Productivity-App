name: Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify Windows setup
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ai/package-lock.json
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version must use x.y.z" }
          "KAIZEN_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build single-file setup
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-installer.ps1 -Version $env:KAIZEN_RELEASE_VERSION
      - name: Install silently
        shell: pwsh
        run: |
          $setup = "release-artifacts/Kaizen-$env:KAIZEN_RELEASE_VERSION-win-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not produced" }
          $process = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)" }
      - name: Verify installed runtime
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs/Kaizen"
          & "$install/runtime/node/node.exe" "$install/scripts/verify-package.mjs" --report "$env:RUNNER_TEMP/package-verification.json"
          if ($LASTEXITCODE -ne 0) { throw "Installed package verification failed" }
          $report = Get-Content "$env:RUNNER_TEMP/package-verification.json" -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.classification -ne "PUBLIC-SANITIZED-AGGREGATE") { throw "Verification report did not pass its public-safe contract" }
          Copy-Item "$env:RUNNER_TEMP/package-verification.json" "release-artifacts/package-verification.json"
      - name: Uninstall silently
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs/Kaizen"
          $uninstaller = Get-ChildItem $install -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Registered uninstaller was not found" }
          $process = Start-Process $uninstaller.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed with exit code $($process.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$install/frontend/server.js") { throw "Installed runtime remained after uninstall" }
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: Kaizen-${{ steps.version.outputs.value }}-win-x64
          path: |
            release-artifacts/Kaizen-${{ steps.version.outputs.value }}-win-x64-setup.exe
            release-artifacts/Kaizen-${{ steps.version.outputs.value }}-win-x64-setup.exe.sha256
            release-artifacts/package-verification.json
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish open-source release
    if: github.ref_type == 'tag'
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kaizen-${{ needs.build-and-verify.outputs.version }}-win-x64
          path: release-artifacts
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-artifacts/* --repo "${{ github.repository }}" --generate-notes --verify-tag
