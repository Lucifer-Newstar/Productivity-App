name: Kaizen CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ai]

permissions:
  contents: read

concurrency:
  group: kaizen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend application
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript and ESLint
        run: |
          npx tsc --noEmit
          npm run lint
      - name: Product and security suites
        run: |
          node scripts/qa-health.js
          npm run qa:entertainment
          npm run qa:entertainment:intelligence
          npm run qa:entertainment:reports
          npm run qa:entertainment:social
          npm run qa:entertainment:migration
          npm run qa:security
          npm run qa:notifications
          npm run qa:ui
          npm run qa:home
          npm run qa:csp
          npm run qa:ai
          npm run qa:core
          npm run qa:baseline
          npm run qa:backup
          npm run qa:resilience
          npm run qa:docs
          npm run qa:comments
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Reference API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run security:startup
      - name: Authenticated loopback security smoke
        env:
          KAIZEN_API_KEY: security-test-key
        run: |
          npm start > /tmp/kaizen-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4000/api/health-check >/dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/kaizen-backend.log; exit 1; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4000/api/health-check >/dev/null
          npm run security:test
      - run: npm audit --omit=dev --audit-level=high

  intelligence:
    name: Deterministic Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: ai/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Contracts, runtime, security and deterministic evaluation
        run: |
          npm run typecheck
          npm test
          npm run qa:v0.1.1
          npm run eval:v0.1.1
          npm run qa:v0.1.1:model-design
          npm run qa:v0.1.1:model-harness
          npm run build
      - name: Privacy and reproducibility
        run: |
          python wave0/scripts/privacy_scan.py --mode tracked
          git diff --exit-code
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Frontend to deterministic Core Today
    runs-on: ubuntu-latest
    needs: [frontend, intelligence]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            ai/package-lock.json
      - name: Install application workspaces
        run: |
          npm ci --prefix ai
          npm ci --prefix frontend
      - name: Build deterministic engine
        run: npm run build --prefix ai
      - name: Live pairing, SSE, bridge and source verification
        run: node scripts/ci/core-today-integration.mjs
